    <!-- Basket Body Trapezoid -->
    <path d="M 4 6 L 80 6 L 68 46 L 16 46 Z" fill="none" stroke="#DF5E26" stroke-width="5" stroke-linejoin="round" />
    <!-- Basket Grid Lines -->
