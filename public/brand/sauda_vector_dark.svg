    <line x1="12" y1="31" x2="72" y2="31" stroke="#DF5E26" stroke-width="3.5" />
    
    <line x1="26" y1="6" x2="28" y2="46" stroke="#DF5E26" stroke-width="3" />
    <line x1="42" y1="6" x2="42" y2="46" stroke="#DF5E26" stroke-width="3" />
    <line x1="58" y1="6" x2="56" y2="46" stroke="#DF5E26" stroke-width="3" />

    <!-- Basket Wheel / Base Wheels -->
