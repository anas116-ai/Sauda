<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Background: Deep Slate Obsidian -->
  <rect width="800" height="800" fill="#0B132B" rx="0"/>
  
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Golden Ratio Balance Scale Geometry -->
  <g transform="translate(400, 310)">
    <!-- Central Pivot Needle -->
    <circle cx="0" cy="0" r="16" fill="url(#goldGrad)"/>
    <line x1="0" y1="-80" x2="0" y2="30" stroke="url(#silverGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Balance Beam Arc forming 'S' curve -->
    <path d="M -130 -40 C -80 -80 0 -50 0 0 C 0 50 80 80 130 40" fill="none" stroke="url(#silverGrad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Left Scale Pan -->
    <path d="M -160 40 Q -130 90 -100 40 Z" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round"/>
    <line x1="-130" y1="-40" x2="-130" y2="40" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-dasharray="6,6"/>

    <!-- Right Scale Pan -->
    <path d="M 100 40 Q 130 90 160 40 Z" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round"/>
    <line x1="130" y1="40" x2="130" y2="40" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-dasharray="6,6"/>
  </g>

  <!-- Brand Wordmark -->
  <text x="400" y="550" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="10" fill="#FFFFFF">
    SAUDA
  </text>

  <!-- Telugu Typography -->
  <text x="400" y="605" text-anchor="middle" font-family="'Noto Sans Telugu', sans-serif" font-size="26" font-weight="700" letter-spacing="4" fill="#FCD34D">
    సౌదా
  </text>

  <text x="400" y="650" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="#64748B">
    FAIR TRADE &amp; RETAIL EQUILIBRIUM
  </text>
</svg>