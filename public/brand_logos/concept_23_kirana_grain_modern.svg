<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Background: Deep Forest Obsidian -->
  <rect width="800" height="800" fill="#031E17" rx="0"/>
  
  <defs>
    <linearGradient id="emeraldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Abstract Grain Stalk & Flowing S Emblem -->
  <g transform="translate(400, 310)">
    <!-- Central Stalk Ribbon -->
    <path d="M 0 -130 Q -60 -40 0 20 Q 60 80 0 140" fill="none" stroke="url(#emeraldGold)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Grain Kernels forming S wings -->
    <path d="M 0 -100 Q -50 -130 -60 -80 Q -30 -60 0 -80" fill="url(#emeraldGold)"/>
    <path d="M 0 -50 Q 50 -80 60 -30 Q 30 -10 0 -30" fill="url(#emeraldGold)"/>
    <path d="M 0 0 Q -50 -30 -60 20 Q -30 40 0 20" fill="url(#emeraldGold)"/>
    <path d="M 0 50 Q 50 20 60 70 Q 30 90 0 70" fill="url(#emeraldGold)"/>
    <path d="M 0 100 Q -50 70 -60 120 Q -30 140 0 120" fill="url(#emeraldGold)"/>
    
    <!-- Outer Circular Halo -->
    <circle cx="0" cy="5" r="160" fill="none" stroke="rgba(52, 211, 153, 0.2)" stroke-width="2"/>
    <circle cx="0" cy="5" r="175" fill="none" stroke="rgba(251, 191, 36, 0.3)" stroke-width="1" stroke-dasharray="8,8"/>
  </g>

  <!-- Brand Wordmark -->
  <text x="400" y="555" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="44" font-weight="800" letter-spacing="8" fill="#FFFFFF">
    SAUDA
  </text>

  <!-- Telugu Typography -->
  <text x="400" y="605" text-anchor="middle" font-family="'Noto Sans Telugu', sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#34D399">
    సౌదా
  </text>

  <text x="400" y="648" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#6EE7B7">
    INDIAN KIRANA HERITAGE &amp; COMMERCE
  </text>
</svg>