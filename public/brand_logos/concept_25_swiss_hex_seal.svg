<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Background: Pristine Gallery Off-White -->
  <rect width="800" height="800" fill="#F8FAFC" rx="0"/>
  
  <defs>
    <linearGradient id="hexSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Isometric Hexagonal Commerce Seal -->
  <g transform="translate(400, 310)">
    <!-- Outer Hexagon Frame -->
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="none" stroke="url(#hexSlate)" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Inner Geometric S & Isometric Store Box Silhouette -->
    <path d="M 0 -150 L 0 0 L 130 75" fill="none" stroke="#CBD5E1" stroke-width="6"/>
    <path d="M 0 0 L -130 75" fill="none" stroke="#CBD5E1" stroke-width="6"/>
    
    <!-- Bold Modular 'S' Ribbon inside Isometric Projection -->
    <path d="M 65 -112 L -65 -37 L 0 0 L 65 37 L -65 112" fill="none" stroke="#2563EB" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Wordmark -->
  <text x="400" y="555" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="46" font-weight="900" letter-spacing="10" fill="#0F172A">
    SAUDA
  </text>

  <!-- Telugu Typography -->
  <text x="400" y="605" text-anchor="middle" font-family="'Noto Sans Telugu', sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#2563EB">
    సౌదా
  </text>

  <text x="400" y="648" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="5" fill="#64748B">
    SWISS ARCHITECTURAL PRECISION
  </text>
</svg>