<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Background: Industrial Warm Matte Grey -->
  <rect width="800" height="800" fill="#E5E7EB" rx="0"/>

  <!-- Dieter Rams / Braun Ultra-Reductive Geometry -->
  <g transform="translate(400, 310)">
    <!-- Top Arc -->
    <path d="M 60 -100 A 70 70 0 0 0 -80 -100 A 70 70 0 0 0 -10 -30" fill="none" stroke="#111827" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Bottom Arc -->
    <path d="M -60 100 A 70 70 0 0 0 80 100 A 70 70 0 0 0 10 30" fill="none" stroke="#111827" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Focal Precision Orange Accent Dot -->
    <circle cx="0" cy="0" r="16" fill="#EA580C"/>
  </g>

  <!-- Brand Wordmark: Clean Akzidenz-Style Grotesque -->
  <text x="400" y="555" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="46" font-weight="900" letter-spacing="8" fill="#111827">
    SAUDA
  </text>

  <!-- Telugu Typography -->
  <text x="400" y="605" text-anchor="middle" font-family="'Noto Sans Telugu', sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#EA580C">
    సౌదా
  </text>

  <text x="400" y="648" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="6" fill="#6B7280">
    LESS BUT BETTER • DIETER RAMS PHILOSOPHY
  </text>
</svg>