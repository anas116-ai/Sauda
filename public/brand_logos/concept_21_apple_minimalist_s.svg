<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Background: Apple Obsidian Canvas -->
  <rect width="800" height="800" fill="#0A0F1D" rx="0"/>
  
  <!-- Ambient Gradient Glow -->
  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0A0F1D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="appleSquircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <circle cx="400" cy="360" r="320" fill="url(#ambientGlow)"/>

  <!-- Apple Frosted Squircle Container -->
  <rect x="260" y="180" width="280" height="280" rx="64" fill="url(#appleSquircleGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Architectural 'S' Monogram (Folded Golden-Ratio Ribbon) -->
  <path d="M 440 250 C 475 250 500 275 500 310 C 500 350 440 365 400 380 C 360 395 300 410 300 450 C 300 485 325 510 360 510" 
        fill="none" stroke="url(#markGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  
  <path d="M 360 250 L 440 250" fill="none" stroke="url(#accentBlue)" stroke-width="28" stroke-linecap="round"/>
  <path d="M 440 510 L 360 510" fill="none" stroke="url(#accentBlue)" stroke-width="28" stroke-linecap="round"/>

  <!-- Brand Wordmark -->
  <text x="400" y="580" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="8" fill="#FFFFFF">
    SAUDA
  </text>

  <!-- Telugu Typography -->
  <text x="400" y="630" text-anchor="middle" font-family="'Noto Sans Telugu', sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#94A3B8">
    సౌదా
  </text>
  
  <text x="400" y="670" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#64748B">
    NEXT-GEN RETAIL OPERATING SYSTEM
  </text>
</svg>